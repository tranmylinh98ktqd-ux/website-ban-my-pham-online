<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Website Bán Mỹ Phẩm Online</title>

  <meta name="description"
        content="Đồ án Website bán mỹ phẩm online - Trần Thị Mỹ Linh">

  <link rel="stylesheet"
        href="//cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">

  <style>
    :root {
      --theme-color: #e75480;
    }

    .app-name-link {
      font-weight: bold;
    }

    .markdown-section h1 {
      color: #d63384;
    }

    .markdown-section h2 {
      color: #e75480;
    }
  </style>
</head>

<body>

  <div id="app">Đang tải Website Mỹ Phẩm Online...</div>

  <script>
    window.$docsify = {
      name: '💄 MỸ PHẨM ONLINE',
      repo: '',
      loadSidebar: true,
      subMaxLevel: 2,
      auto2top: true,
      search: {
        placeholder: 'Tìm kiếm sản phẩm...',
        noData: 'Không tìm thấy nội dung!',
        depth: 3
      },
      copyCode: {
        buttonText: 'Sao chép',
        errorText: 'Lỗi',
        successText: 'Đã sao chép'
      }
    }
  </script>

  <script src="//cdn.jsdelivr.net/npm/docsify@4"></script>

  <!-- Plugin tìm kiếm -->
  <script src="//cdn.jsdelivr.net/npm/docsify/lib/plugins/search.min.js"></script>

  <!-- Plugin sao chép mã -->
  <script src="//cdn.jsdelivr.net/npm/docsify-copy-code/dist/docsify-copy-code.min.js"></script>

  <!-- Plugin phân trang -->
  <script src="//cdn.jsdelivr.net/npm/docsify-pagination/dist/docsify-pagination.min.js"></script>

</body>
</html>
